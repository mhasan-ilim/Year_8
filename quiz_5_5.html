<style>
  :root {
    --navy: #1B2A4A; --navy2: #23375F; --teal: #2E7D6E; --gold: #C99A2E;
    --ink: #1A1A1A; --mute: #5B6B7A; --soft: #EFF3F1; --line: #E3E7E9; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  #quiz-app {
    font-family: Calibri, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--white);
    max-width: 880px; margin: 0 auto; line-height: 1.5; padding-bottom: 60px;
  }
  #quiz-app h1, #quiz-app h2 { margin: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;
    border-bottom: 3px solid var(--gold); background: var(--navy); color: white; position: sticky; top: 0; z-index: 20;
  }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .right { display:flex; align-items:center; gap: 12px; }
  .timer { background: rgba(255,255,255,0.12); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
  .timer.low { background: #B3271E; }
  .staff-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.55);
    width: 30px; height: 30px; border-radius: 999px; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .staff-btn:hover { color: white; border-color: rgba(255,255,255,0.5); }
  .hero { padding: 20px 20px 8px; border-bottom: 1px solid var(--line); }
  .hero .eyebrow { color: var(--teal); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .hero h1 { font-size: 24px; margin-top: 4px; }
  .hero .sub { color: var(--mute); font-style: italic; margin-top: 4px; font-size: 14px; }
  .panel { padding: 18px 20px; }
  .setup-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  @media (max-width: 640px) { .setup-grid { grid-template-columns: 1fr; } }
  label.field-label { display:block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: white;
  }
  textarea { resize: vertical; min-height: 50px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
  .part-header {
    margin-top: 28px; padding: 10px 16px; background: var(--navy); color: white; border-radius: 10px;
    font-size: 14px; font-weight: 700; display:flex; justify-content: space-between; align-items:center;
  }
  .part-header .count { font-weight: 500; font-size: 12.5px; color: #C7D3E8; }
  .q { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
  .q .qnum { display:inline-block; background: var(--soft); color: var(--navy); font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; }
  .q .marks { float: right; color: var(--mute); font-size: 11.5px; font-weight: 700; }
  .q label.qtext { display:block; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
  .mcq-opts { display: grid; gap: 6px; }
  .mcq-opt { display:flex; align-items:center; gap: 8px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .mcq-opt:hover { border-color: var(--teal); }
  .mcq-opt input { margin: 0; }
  .btn { background: var(--navy); color: white; border: none; padding: 11px 22px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: var(--navy2); }
  .btn.secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn.small { padding: 6px 14px; font-size: 12.5px; }
  .submit-row { margin-top: 26px; padding: 18px 20px; background: var(--soft); border-radius: 12px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .status-msg { font-size: 13.5px; font-weight: 600; }
  .status-msg.ok { color: var(--teal); }
  .status-msg.err { color: #B3271E; }
  .footnote { font-size: 12px; color: var(--mute); margin-top: 10px; }
  .teacher-toolbar { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .teacher-toolbar .field { min-width: 140px; }
  table.roster { width:100%; border-collapse:collapse; font-size:13px; }
  table.roster th { text-align:left; padding:8px 10px; background:var(--navy); color:white; position:sticky; top:0; }
  table.roster td { padding:8px 10px; border-bottom:1px solid var(--line); }
  table.roster tr:hover td { background: #F7F9FC; cursor:pointer; }
  .empty-state { text-align:center; padding: 50px 20px; color: var(--mute); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(20,25,40,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal { background:white; border-radius:14px; max-width:680px; width:100%; max-height:85vh; overflow-y:auto; padding:22px; }
  .modal h3 { color: var(--navy); font-size:18px; margin-bottom:4px; }
  .modal .meta { color: var(--mute); font-size:12.5px; margin-bottom:16px; }
  .modal .block { margin-bottom:14px; }
  .modal .block .k { font-weight:700; font-size:12.5px; color: var(--teal); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px;}
  .modal .block .v { font-size:14px; white-space:pre-wrap; }
  .modal-close { float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--mute); line-height:1;}
  .badge-cls { background: var(--soft); color: var(--navy); padding: 2px 8px; border-radius: 999px; font-size:11.5px; font-weight:700; }
</style>

<div id="quiz-app">
  <div class="topbar">
    <div class="title">Year 8 Science &middot; Topic 5.5 Quiz</div>
    <div class="right">
      <div class="timer" id="timer-display">30:00</div>
      <button class="staff-btn" id="tab-teacher-btn" title="Staff access">&#128274;</button>
    </div>
  </div>

  <div class="hero">
    <div class="eyebrow">Assessment &middot; 20 marks</div>
    <h1>Physical Change Is a Change in Shape or Appearance &mdash; Quiz</h1>
    <div class="sub">11 multiple choice (1 mark each), 5 short answer in a maximum of three sentences (1 mark each), 2 extended response (2 marks each).</div>
  </div>

  <div id="view-student" class="panel"></div>
  <div id="view-teacher" class="panel" style="display:none;"></div>
  <div id="modal-root"></div>
</div>

<script>
(function () {
  document.title = "Year 8 Science \u2014 Topic 5.5 Quiz";

  // ---- SETUP: this reuses the same Google Apps Script Web App URL as the other quizzes ----
  const SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbwUKwTEsb1_AXQCC-cHr8dqCDGKOw7kMVTi0RD-iJp1JQ8AIKFqOXKp5uFM21C-f7idQw/exec";
  const ENDPOINT_READY = SUBMIT_ENDPOINT.indexOf("PASTE_YOUR") === -1;
  const QUIZ_ID = "5_5"; // identifies this quiz's tab in the shared spreadsheet
  const TEACHER_PIN = "1234";
  let staffUnlocked = false;

  const CLASSES = ["8A", "8B", "8C", "8D", "Other"];

  const MCQS = [
    { stem: "During a physical change, what happens to the molecules of the substance?",
      options: ["They are destroyed", "They stay exactly the same", "They turn into different molecules", "They disappear and reform"], correct: 1 },
    { stem: "What is a lattice?",
      options: ["A gas made of a single atom", "A three-dimensional arrangement of particles in a regular pattern", "The temperature at which a liquid boils", "A type of chemical formula"], correct: 1 },
    { stem: "What is the general term for a liquid becoming a solid, used for any substance (not just water)?",
      options: ["Melting", "Vaporisation", "Solidification", "Condensation"], correct: 2 },
    { stem: "What do we call a vapour that is smelly?",
      options: ["A fume", "A solute", "A lattice", "A colloid"], correct: 0 },
    { stem: "Which of these liquids is volatile (evaporates easily at room temperature)?",
      options: ["Cooking oil", "Petrol", "Honey", "Golden syrup"], correct: 1 },
    { stem: "What is the boiling point of a liquid?",
      options: ["The temperature at which it freezes", "The temperature at which it boils and becomes a gas", "The temperature at which it condenses", "The coldest temperature a liquid can reach"], correct: 1 },
    { stem: "What happens when a gas condenses?",
      options: ["It becomes a solid", "It becomes a liquid", "It disappears completely", "It becomes hotter"], correct: 1 },
    { stem: "What is dry ice actually made of?",
      options: ["Frozen water", "Solid carbon dioxide", "Solid nitrogen", "Frozen oxygen"], correct: 1 },
    { stem: "What is sublimation?",
      options: ["A liquid changing into a gas", "A solid changing directly into a gas, with no liquid stage", "A gas changing directly into a solid", "A solid changing into a liquid"], correct: 1 },
    { stem: "The 'smoke' produced by dry ice at a concert is actually:",
      options: ["Carbon dioxide gas", "Condensed water vapour, not carbon dioxide", "Burnt sugar particles", "Nitrogen gas"], correct: 1 },
    { stem: "Which TWO of these substances are known to sublime? Select both correct answers.",
      options: ["Ice", "Dry ice (CO\u2082)", "Salt", "Diamond"], correct: [1, 3] },
  ];

  const SHORTS = [
    "Define the term 'lattice'.",
    "Define the term 'volatile'.",
    "Explain why physical changes are reversible.",
    "Explain why shattering a block of ice is considered a physical change.",
    "Explain why all perfumes are volatile liquids.",
  ];

  const EXTENDED = [
    { stem: "Describe the three major states of water (solid, liquid, gas) in terms of how the water particles are arranged and how much energy they have in each state. Then name the physical change that turns liquid water into ice, and the physical change that turns liquid water into water vapour.", marks: 2 },
    { stem: "A student claimed that the bubbles in boiling water are oxygen gas. Evaluate this claim: describe the kinetic energy changes that occur as water boils, describe what type of molecules are actually found in the bubbles, and decide whether the student's statement is correct.", marks: 2 },
  ];

  let state = {
    name: "", cls: "8D", date: new Date().toISOString().slice(0, 10),
    mcqAnswers: MCQS.map((m) => (Array.isArray(m.correct) ? [] : null)),
    shortAnswers: new Array(SHORTS.length).fill(""),
    extendedAnswers: new Array(EXTENDED.length).fill(""),
  };
  let submitted = false;
  let submitStatus = null;

  function elx(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach((c) => { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(t); }

  function isMultiSelect(mcq) { return Array.isArray(mcq.correct); }
  function isCorrect(mcq, given) {
    if (isMultiSelect(mcq)) {
      if (!Array.isArray(given) || given.length === 0) return false;
      const a = [...given].sort();
      const b = [...mcq.correct].sort();
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }
    return given === mcq.correct;
  }

  // ---------------- Timer (visual only, does not force submission) ----------------
  let secondsLeft = 30 * 60;
  let timerInterval = null;
  function startTimer() {
    timerInterval = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
      const disp = document.getElementById("timer-display");
      if (disp) {
        disp.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        disp.classList.toggle("low", secondsLeft <= 60);
      }
      if (secondsLeft === 0) clearInterval(timerInterval);
    }, 1000);
  }

  function renderStudent() {
    const root = document.getElementById("view-student");
    root.innerHTML = "";

    const setup = elx("div", { class: "setup-grid" });
    const nameWrap = elx("div", {}, [elx("label", { class: "field-label" }, [text("Your name")])]);
    const nameInput = elx("input", { type: "text", placeholder: "e.g. Yusuf A." });
    nameInput.value = state.name; nameInput.oninput = (e) => { state.name = e.target.value; };
    nameWrap.appendChild(nameInput);

    const clsWrap = elx("div", {}, [elx("label", { class: "field-label" }, [text("Class")])]);
    const clsSelect = elx("select");
    CLASSES.forEach((c) => {
      const opt = elx("option", { value: c }, [text(c)]);
      if (c === state.cls) opt.selected = true;
      clsSelect.appendChild(opt);
    });
    clsSelect.onchange = (e) => { state.cls = e.target.value; };
    clsWrap.appendChild(clsSelect);

    const dateWrap = elx("div", {}, [elx("label", { class: "field-label" }, [text("Date")])]);
    const dateInput = elx("input", { type: "date" });
    dateInput.value = state.date; dateInput.onchange = (e) => { state.date = e.target.value; };
    dateWrap.appendChild(dateInput);

    setup.appendChild(nameWrap); setup.appendChild(clsWrap); setup.appendChild(dateWrap);
    root.appendChild(setup);

    // Part A: Multiple Choice
    root.appendChild(elx("div", { class: "part-header" }, [
      elx("span", {}, [text("Part A \u2014 Multiple Choice")]),
      elx("span", { class: "count" }, [text(MCQS.length + " questions \u00B7 1 mark each")]),
    ]));
    MCQS.forEach((mcq, qi) => {
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + (qi + 1))]));
      const multi = isMultiSelect(mcq);
      if (multi) q.appendChild(elx("span", { class: "marks" }, [text("select 2 answers")]));
      q.appendChild(elx("label", { class: "qtext" }, [text(mcq.stem)]));
      const opts = elx("div", { class: "mcq-opts" });
      mcq.options.forEach((optText, oi) => {
        const optRow = elx("label", { class: "mcq-opt" });
        const input = multi
          ? elx("input", { type: "checkbox" })
          : elx("input", { type: "radio", name: "mcq" + qi });
        if (multi) {
          input.checked = Array.isArray(state.mcqAnswers[qi]) && state.mcqAnswers[qi].includes(oi);
          input.onchange = () => {
            const cur = Array.isArray(state.mcqAnswers[qi]) ? state.mcqAnswers[qi] : [];
            state.mcqAnswers[qi] = input.checked ? [...cur, oi] : cur.filter((v) => v !== oi);
          };
        } else {
          input.checked = state.mcqAnswers[qi] === oi;
          input.onchange = () => { state.mcqAnswers[qi] = oi; };
        }
        optRow.appendChild(input);
        optRow.appendChild(text(optText));
        opts.appendChild(optRow);
      });
      q.appendChild(opts);
      root.appendChild(q);
    });

    // Part B: Short Answer
    root.appendChild(elx("div", { class: "part-header" }, [
      elx("span", {}, [text("Part B \u2014 Short Answer")]),
      elx("span", { class: "count" }, [text(SHORTS.length + " questions \u00B7 1 mark each \u00B7 answer in a maximum of three sentences")]),
    ]));
    SHORTS.forEach((stem, qi) => {
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + (qi + 1))]));
      q.appendChild(elx("label", { class: "qtext" }, [text(stem)]));
      const ta = elx("textarea", { placeholder: "Answer in a maximum of three sentences" });
      ta.style.minHeight = "60px";
      ta.value = state.shortAnswers[qi]; ta.oninput = (e) => { state.shortAnswers[qi] = e.target.value; };
      q.appendChild(ta);
      root.appendChild(q);
    });

    // Part C: Extended Response
    root.appendChild(elx("div", { class: "part-header" }, [
      elx("span", {}, [text("Part C \u2014 Extended Response")]),
      elx("span", { class: "count" }, [text(EXTENDED.length + " questions \u00B7 2 marks each")]),
    ]));
    EXTENDED.forEach((item, qi) => {
      const q = elx("div", { class: "q" });
      q.appendChild(elx("div", { class: "qnum" }, [text("Q" + (qi + 1))]));
      q.appendChild(elx("span", { class: "marks" }, [text(item.marks + " marks")]));
      q.appendChild(elx("label", { class: "qtext" }, [text(item.stem)]));
      const ta = elx("textarea", {});
      ta.style.minHeight = "90px";
      ta.value = state.extendedAnswers[qi]; ta.oninput = (e) => { state.extendedAnswers[qi] = e.target.value; };
      q.appendChild(ta);
      root.appendChild(q);
    });

    // Submit row
    const submitRow = elx("div", { class: "submit-row" });
    const btn = elx("button", { class: "btn" }, [text(submitted ? "Update my answers" : "Submit my quiz")]);
    btn.onclick = handleSubmit;
    submitRow.appendChild(btn);
    if (submitStatus) submitRow.appendChild(elx("div", { class: "status-msg " + submitStatus.type }, [text(submitStatus.msg)]));
    root.appendChild(submitRow);
    root.appendChild(elx("div", { class: "footnote" }, [text("Short-answer and extended-response questions are marked by your teacher \u2014 only the multiple-choice section is scored automatically. If you make a mistake, update your answers and submit again \u2014 it replaces your previous submission.")]));
  }

  async function handleSubmit() {
    if (!state.name.trim()) {
      submitStatus = { type: "err", msg: "Please enter your name before submitting." };
      renderStudent();
      return;
    }
    if (!ENDPOINT_READY) {
      submitStatus = { type: "err", msg: "This quiz isn't connected yet \u2014 ask your teacher to finish setup." };
      renderStudent();
      return;
    }
    submitStatus = { type: "ok", msg: "Saving\u2026" };
    renderStudent();
    const mcqScore = MCQS.reduce((n, m, i) => n + (isCorrect(m, state.mcqAnswers[i]) ? 1 : 0), 0);
    const payload = {
      quiz: QUIZ_ID,
      name: state.name.trim(), cls: state.cls, date: state.date,
      mcqAnswers: state.mcqAnswers, mcqScore, mcqTotal: MCQS.length,
      shortAnswers: state.shortAnswers,
      extendedAnswers: state.extendedAnswers,
      submittedAt: new Date().toISOString(),
    };
    try {
      const res = await fetch(SUBMIT_ENDPOINT, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      if (!result || result.ok !== true) throw new Error((result && result.error) || "save failed");
      submitted = true;
      submitStatus = { type: "ok", msg: "Submitted! Your teacher will see your answers." };
    } catch (err) {
      submitStatus = { type: "err", msg: "Couldn't save right now \u2014 check your connection and try again." };
    }
    renderStudent();
  }

  // ---------------- Teacher dashboard ----------------
  let teacherData = [];
  let teacherLoading = false;
  let teacherError = null;
  let filterCls = "All";
  let filterDate = "";

  async function loadTeacherData() {
    if (!ENDPOINT_READY) {
      teacherError = "This dashboard isn't connected to a spreadsheet yet. Complete the setup steps in the .gs.txt guide, then refresh.";
      teacherLoading = false; renderTeacher(); return;
    }
    teacherLoading = true; teacherError = null;
    renderTeacher();
    try {
      const res = await fetch(SUBMIT_ENDPOINT + "?quiz=" + QUIZ_ID, { method: "GET" });
      const rows = await res.json();
      const items = (rows || []).map((r) => ({
        name: r.name, cls: r.cls, date: r.date,
        mcqAnswers: safeParse(r.mcqAnswers, []), mcqScore: Number(r.mcqScore) || 0, mcqTotal: Number(r.mcqTotal) || MCQS.length,
        shortAnswers: safeParse(r.shortAnswers, []),
        extendedAnswers: safeParse(r.extendedAnswers, []),
        submittedAt: r.submittedAt,
      }));
      items.sort((a, b) => (a.name > b.name ? 1 : -1));
      teacherData = items;
    } catch (err) {
      teacherError = "Couldn't load submissions. Check your connection and try refreshing.";
    }
    teacherLoading = false;
    renderTeacher();
  }
  function safeParse(v, fallback) {
    if (v && typeof v === "object") return v;
    try { return JSON.parse(v); } catch (e) { return fallback; }
  }

  function downloadCsv() {
    const rows = [["Name", "Class", "Date", "MCQ Score (/11)", "Submitted At"]];
    filteredData().forEach((d) => { rows.push([d.name, d.cls, d.date, `${d.mcqScore}/${d.mcqTotal}`, d.submittedAt]); });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "quiz_5_5_submissions.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function filteredData() {
    return teacherData.filter((d) => {
      if (filterCls !== "All" && d.cls !== filterCls) return false;
      if (filterDate && d.date !== filterDate) return false;
      return true;
    });
  }

  function showDetail(d) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    const backdrop = elx("div", { class: "modal-backdrop" });
    backdrop.onclick = (e) => { if (e.target === backdrop) root.innerHTML = ""; };
    const modal = elx("div", { class: "modal" });
    const closeBtn = elx("button", { class: "modal-close" }, [text("\u00D7")]);
    closeBtn.onclick = () => { root.innerHTML = ""; };
    modal.appendChild(closeBtn);
    modal.appendChild(elx("h3", {}, [text(d.name)]));
    modal.appendChild(elx("div", { class: "meta" }, [text(`Class ${d.cls} \u00B7 ${d.date} \u00B7 Submitted ${new Date(d.submittedAt).toLocaleString()} \u00B7 MCQ: ${d.mcqScore}/${d.mcqTotal}`)]));

    function block(k, v) {
      return elx("div", { class: "block" }, [elx("div", { class: "k" }, [text(k)]), elx("div", { class: "v" }, [text(v || "\u2014")])]);
    }
    MCQS.forEach((mcq, i) => {
      const given = d.mcqAnswers[i];
      let givenText;
      if (isMultiSelect(mcq)) {
        const givenArr = Array.isArray(given) ? given : [];
        const givenLabels = givenArr.length ? givenArr.map((oi) => mcq.options[oi]).join(", ") : "No answer";
        const correctLabels = mcq.correct.map((oi) => mcq.options[oi]).join(", ");
        givenText = givenLabels + (isCorrect(mcq, given) ? "  \u2713" : "  \u2717 (correct: " + correctLabels + ")");
      } else {
        givenText = given === null || given === undefined ? "No answer" : mcq.options[given] + (given === mcq.correct ? "  \u2713" : "  \u2717 (correct: " + mcq.options[mcq.correct] + ")");
      }
      modal.appendChild(block("MCQ " + (i + 1), givenText));
    });
    SHORTS.forEach((stem, i) => modal.appendChild(block("Short Answer " + (i + 1), d.shortAnswers[i])));
    EXTENDED.forEach((item, i) => modal.appendChild(block("Extended Response " + (i + 1) + " (" + item.marks + " marks)", d.extendedAnswers[i])));

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
  }

  function renderTeacher() {
    const root = document.getElementById("view-teacher");
    root.innerHTML = "";

    const toolbar = elx("div", { class: "teacher-toolbar" });
    const backBtn = elx("button", { class: "btn secondary small" }, [text("\u2190 Back to quiz")]);
    backBtn.onclick = () => {
      document.getElementById("view-teacher").style.display = "none";
      document.getElementById("view-student").style.display = "";
    };
    toolbar.appendChild(backBtn);
    const clsField = elx("div", { class: "field" }, [elx("label", { class: "field-label" }, [text("Class")])]);
    const clsSel = elx("select");
    ["All"].concat(CLASSES).forEach((c) => {
      const opt = elx("option", { value: c }, [text(c)]);
      if (c === filterCls) opt.selected = true;
      clsSel.appendChild(opt);
    });
    clsSel.onchange = (e) => { filterCls = e.target.value; renderTeacher(); };
    clsField.appendChild(clsSel);

    const dateField = elx("div", { class: "field" }, [elx("label", { class: "field-label" }, [text("Date")])]);
    const dateSel = elx("input", { type: "date" });
    dateSel.value = filterDate; dateSel.onchange = (e) => { filterDate = e.target.value; renderTeacher(); };
    dateField.appendChild(dateSel);
    const clearDateBtn = elx("button", { class: "btn secondary small" }, [text("Clear date")]);
    clearDateBtn.onclick = () => { filterDate = ""; renderTeacher(); };

    const refreshBtn = elx("button", { class: "btn secondary small" }, [text("Refresh")]);
    refreshBtn.onclick = loadTeacherData;
    const csvBtn = elx("button", { class: "btn small" }, [text("Download CSV")]);
    csvBtn.onclick = downloadCsv;

    toolbar.appendChild(clsField); toolbar.appendChild(dateField); toolbar.appendChild(clearDateBtn);
    toolbar.appendChild(refreshBtn); toolbar.appendChild(csvBtn);
    root.appendChild(toolbar);

    if (teacherLoading) { root.appendChild(elx("div", { class: "empty-state" }, [text("Loading submissions\u2026")])); return; }
    if (teacherError) { root.appendChild(elx("div", { class: "empty-state" }, [text(teacherError)])); return; }
    const data = filteredData();
    if (data.length === 0) {
      root.appendChild(elx("div", { class: "empty-state" }, [text("No submissions yet for this filter.")]));
      return;
    }

    root.appendChild(elx("div", { class: "footnote" }, [text(data.length + " submission" + (data.length === 1 ? "" : "s") + " \u00B7 click a row for full answers")]));
    const table = elx("table", { class: "roster" });
    table.appendChild(elx("tr", {}, ["Name", "Class", "Date", "MCQ Score", "Submitted"].map((h) => elx("th", {}, [text(h)]))));
    data.forEach((d) => {
      const tr = elx("tr");
      tr.onclick = () => showDetail(d);
      tr.appendChild(elx("td", {}, [text(d.name)]));
      tr.appendChild(elx("td", {}, [elx("span", { class: "badge-cls" }, [text(d.cls)])]));
      tr.appendChild(elx("td", {}, [text(d.date)]));
      tr.appendChild(elx("td", {}, [text(d.mcqScore + " / " + d.mcqTotal)]));
      tr.appendChild(elx("td", {}, [text(new Date(d.submittedAt).toLocaleString())]));
      table.appendChild(tr);
    });
    root.appendChild(table);
  }

  document.getElementById("tab-teacher-btn").onclick = () => {
    if (!staffUnlocked) {
      const entered = window.prompt("Staff PIN required to view the dashboard:");
      if (entered === null) return;
      if (entered !== TEACHER_PIN) { window.alert("Incorrect PIN."); return; }
      staffUnlocked = true;
    }
    document.getElementById("view-student").style.display = "none";
    document.getElementById("view-teacher").style.display = "";
    loadTeacherData();
  };

  renderStudent();
  startTimer();
})();
</script>
